name: Publish Docker image

# Runs on every push to master. The image is only pushed to Docker Hub after the frontend and the backend have been
# type-checked and tested on this exact commit, and after the freshly built image has answered a smoke test.

on:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  build-number: ${{ github.run_number }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    name: build frontend, test everything and package the jar
    steps:
      - uses: actions/checkout@v7
      - name: npm set up
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      - name: type check
        working-directory: frontend
        run: npm run typecheck
      - name: frontend tests
        working-directory: frontend
        run: npm test
      - name: build frontend
        working-directory: frontend
        run: npm run build
      - name: embed frontend in backend
        run: |
          mkdir -p executable/src/main/resources/public
          cp -r frontend/build/* executable/src/main/resources/public/
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'corretto'
          cache: maven
      # verify runs the unit tests, packages the jar and runs the *IT tests, including the one that boots the fat jar.
      - name: backend tests and package
        run: mvn -B -f pom.xml verify
      - run: mv ./executable/target/executable-0.1-SNAPSHOT.jar ./executable/target/executable-${{ env.build-number }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: ./executable/target/executable-${{ env.build-number }}.jar
          retention-days: 1

  publish_image:
    runs-on: ubuntu-latest
    name: smoke test and push the Docker image
    needs: build_and_test
    steps:
      - uses: actions/checkout@v7
      # The image is built from the jar that the tests above ran against, not from a fresh build.
      - uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: executable/target

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: dan323/natural-deduction

      - name: Build image for smoke test
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: natural-deduction:smoke

      - name: Smoke test image
        run: |
          docker run -d --name nd-smoke -p 8080:8080 natural-deduction:smoke
          ok=false
          for i in $(seq 1 45); do
            code=$(curl --connect-timeout 2 --max-time 5 -s -o /dev/null -w '%{http_code}' http://localhost:8080/logic/classical/actions || true)
            if [ "$code" = "200" ]; then
              ok=true
              break
            fi
            sleep 2
          done
          if [ "$ok" != "true" ]; then
            echo "GET /logic/classical/actions did not return 200 (last status: $code)"
            docker logs nd-smoke
            exit 1
          fi
          curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/logic/modal/actions > /dev/null
          curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/logic/intuitionistic/actions > /dev/null
          curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/logic/modal-until/actions > /dev/null
          curl --connect-timeout 2 --max-time 5 -fsS http://localhost:8080/ | grep -q 'id="root"'
          docker exec nd-smoke id -u | grep -qv '^0$'
          docker rm -f nd-smoke

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
