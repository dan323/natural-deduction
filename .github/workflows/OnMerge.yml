# Removes the reports that CompileAndTest.yml published to gh-pages for a pull request once that PR is closed.

name: Clean PR reports

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  clean_pages:
    runs-on: ubuntu-latest
    name: delete pr info on github page
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
      # Reports only exist for non-dependabot PRs, so there is often nothing to remove.
      - name: remove data from pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: git rm -r --ignore-unmatch --quiet -- "$PR"
      - name: commit changes on web
        id: commit
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          if git diff --cached --quiet; then
            echo "No reports for PR-$PR, nothing to clean"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --local user.email "pr-clean[bot]@users.noreply.github.com"
          git config --local user.name "pr-clean[bot]"
          git commit -m "Removed PR-$PR reports"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        uses: ad-m/github-push-action@v0.8.0
        with:
          branch: 'gh-pages'
          github_token: ${{ secrets.GITHUB_TOKEN }}
